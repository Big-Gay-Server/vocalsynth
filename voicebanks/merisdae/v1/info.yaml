  - name: "crescentmoon"
    icondeco: "/voicebanks/merisdae/crescentmoon icon.png"
    iconface: "/voicebanks/merisdae/v1/crescentmoon icon.png"
    desc: "A solid, core append."
    dllink:
      - url: "https://drive.google.com/file/d/1ClmDrbJiWOyN5VPumL36_za7w3LQucWU/view?usp=sharing"
        type: "utau"
    expressions:
      - name: "japanese"
        type: "CVVC"
