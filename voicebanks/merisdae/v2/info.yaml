vbname: Merisdae v2
vbsub: Released in 2018.
vbdesc: |
  Transitionary voicebank, leading into Merisdae's newer format.<br>
  1 released expression, with 5 CVVCV pitches. 
num: 2
keyartist: PRISMKidd
keyartistlink: https://bsky.app/profile/prismkidd.bsky.social
vbblurb: |
    Thank you for your interest in Merisdae's v2 voicebank!<br><br>
    This was a transitionary voicebank that was used in between v1 and her latest voicebanks, -NEW PHASE- ! It is more polished than her v1 voicebanks, but doesn't have the same range of appends.<br><br>
    A good option for a solid, modern voicebank!<br><br>
    Only -crescentmoon_japanese- was released to the public.
