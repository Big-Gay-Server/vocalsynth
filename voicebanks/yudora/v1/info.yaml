vbname: Yudora v1
vbsub: Released in 2018.
vbdesc: Yudora's debut voicebank.<br>3 expressions, with 1 CVVC pitch each. 
num: 2
dllink:
keyartist: Momo
keyartistlink: https://bsky.app/profile/sicklymomo.bsky.social
vbblurb: |
  <center>
    Thank you for your interest in Yudora's Classic v1 Voicebanks!<br><br>
    Yudora has 3 different banks!<br><br>
    For instructions on how to use Yudora v1 voicebanks, please see below!
  <br>
  <h3>How to use:</h3>
  To use this bank, simply select the voice you would like to use in UTAU! If you want to
  use any of the "all_" banks (which are packages of all of the appends for that language),
  then you have to add suffixes for each append. The suffixes are as follows: <br><br>
    <li>no suffix: -starcore- (Core, Natural Voicebank)</li>
    <li> S: -supernova- (Strong, Powerful Voicebank)</li>
    <li> N: -nebula- (Soft, Whispery Voicebank)</li>

